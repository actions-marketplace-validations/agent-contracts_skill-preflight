    <text x="96" y="458" font-family="Consolas, monospace" font-size="17" fill="#d5ddd7">Security             35/35</text>
    <text x="96" y="490" font-family="Consolas, monospace" font-size="17" fill="#d5ddd7">Token efficiency     15/15</text>
