<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f5f7f4"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="62" font-size="32" font-weight="750" fill="#171a18">One command. A clear pre-install decision.</text>
    <text x="64" y="96" font-size="18" fill="#59625c">Scan a local folder or GitHub URL without executing the skill.</text>

