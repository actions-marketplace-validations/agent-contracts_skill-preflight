    <text x="96" y="405" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#ffffff">safe-doc-review</text>
    <rect x="320" y="381" width="112" height="34" rx="6" fill="#16a34a"/>
    <text x="376" y="404" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#ffffff">100/100 A</text>
